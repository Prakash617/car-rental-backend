[project]
name = "car-rental-backend"
version = "0.1.0"
description = "Production-grade multi-tenant Car Rental SaaS Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1.0,<5.2.0",
    "django-tenants>=3.7.0",
    "djangorestframework>=3.15.2",
    "djangorestframework-simplejwt>=5.3.1",
    "django-cors-headers>=4.6.0",
    "django-filter>=24.3",
    "drf-spectacular>=0.28.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "django-celery-beat>=2.7.0",
    "django-environ>=0.12.0",
    "python-magic>=0.4.27",
    "pillow>=10.4.0",
    "gunicorn>=23.0.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "model-bakery>=1.20.0",
    "freezegun>=1.5.1",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --reuse-db"
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]
